name: CI

on:
  push:
    branches: [master]
    paths:
      - "**.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "conformance/**"
      - "deny.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always

jobs:
  changes:
    # pull_request used to carry a workflow-level paths filter, so a PR outside those paths got no run at all
    # and the required ci context never reported. The same filter lives here now; the jobs below skip on it.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Did this change touch the paths this workflow tests
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE" HEAD | grep -qE '\.rs$|(^|/)Cargo\.(toml|lock)$|^conformance/|^deny\.toml$|^\.github/workflows/ci\.yml$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          components: rustfmt, clippy
          rustflags: ""
          cache-shared-key: ci-ubuntu

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --exclude guard-core-python -- -D warnings

      - name: Clippy (PyO3 bindings, all features)
        run: cargo clippy -p guard-core-python --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude guard-core-python

  conformance:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Conformance gate (spec 4.1.0)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          rustflags: ""
          cache-shared-key: ci-ubuntu

      - name: Build the pattern-probe child
        run: cargo build -p guard-core-engine --bins

      - name: Ledger integrity
        run: cargo test -p guard-core-conformance --test ledger_integrity -- --nocapture

      - name: Conformance gate
        run: cargo test -p guard-core-conformance --test conformance -- --nocapture

      - name: Pipeline conformance gate
        run: cargo test -p guard-core-conformance --test pipeline_conformance -- --nocapture

  coverage:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: coverage (100% lines)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          rustflags: ""
          cache-shared-key: ci-coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-llvm-cov

      # The gate computes line coverage from the lcov export's per-line DA
      # records, not from llvm-cov's summary table. llvm-cov 22's summary
      # aggregation falsely reports missed lines while every line-level view
      # built from the exact same profdata (show text/html, the lcov export,
      # the cobertura export, the JSON segment list, and a faithful
      # reimplementation of LLVM's LineCoverageStats over the exported
      # regions) reports the files fully covered. It reproduces on macOS
      # arm64/x86_64 and ubuntu-latest, survives a clean coverage target dir
      # and codegen-units=1, and persists on the newest available toolchain
      # (cargo-llvm-cov 0.9.1 + rustc 1.99.0's llvm-tools; the 2026-10-07 CI
      # run on the family's tower branch ran exactly that pair and still
      # reported the phantom misses). Root-cause evidence with the
      # side-by-side views:
      # https://github.com/rennf93/tower-guard-rs/pull/35#issuecomment-6038980718
      # The gate keeps the same fail-closed 100%-lines semantics as before:
      # every abnormal export fails the job, nothing is hidden or excluded.
      - name: Generate the line-coverage export
        run: cargo llvm-cov --workspace --exclude guard-core-python --lcov --output-path lcov.info

      - name: Enforce 100% line coverage from the export's per-line records
        run: python3 .github/scripts/enforce_line_coverage.py lcov.info

      # Informational only: the summary table still prints for the familiar
      # per-file view, but it must never gate - it carries the known
      # aggregation artifact documented above.
      - name: Print the informational llvm-cov summary
        # `report` takes no --exclude: it reads the profdata the run above
        # already produced (guard-core-python was excluded there).
        run: cargo llvm-cov report

  msrv:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: MSRV (1.92)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
          rustflags: ""
          cache-shared-key: ci-msrv

      - name: Check
        run: cargo check --workspace --exclude guard-core-python --all-targets

      # release.yml lints at the tag on this exact toolchain; run the same
      # command here so a PR cannot pass and then fail the release gate.
      - name: Clippy (MSRV, release gate parity)
        run: cargo clippy --workspace --all-targets --exclude guard-core-python -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude guard-core-python

  security:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          rustflags: ""
          cache-shared-key: ci-ubuntu

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        run: cargo audit

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: cargo deny
        run: cargo deny check

  docs:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Docs build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      RUSTDOCFLAGS: -D warnings

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          rustflags: ""
          cache-shared-key: ci-ubuntu

      - name: cargo doc
        run: cargo doc --workspace --exclude guard-core-python --no-deps --all-features

  ci:
    # The context master-rule requires: it reports on every run and fails when a job above failed or was
    # cancelled. A skipped job counts as passed.
    if: always()
    needs: [changes, check, conformance, coverage, msrv, security, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job above succeeded or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs: $RESULTS"
          for result in $RESULTS; do
            case "$result" in failure|cancelled) exit 1 ;; esac
          done
