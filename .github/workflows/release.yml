name: Release Gate

on:
  push:
    tags:
      - 'v*'
  release:
    types: [created]

permissions: {}

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test at tag (${{ matrix.rust }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        rust: ['stable', '1.92.0']
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
          rustflags: ""

      - name: cargo fmt check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --exclude guard-core-python -- -D warnings

      - name: cargo test
        run: cargo test --workspace --exclude guard-core-python

  conformance:
    name: Conformance gate at tag (spec 4.1.0)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: ""

      - name: Ledger integrity
        run: cargo test -p guard-core-conformance --test ledger_integrity -- --nocapture

      - name: Conformance gate
        run: cargo test -p guard-core-conformance --test conformance -- --nocapture

  tag-consistency:
    name: Tag matches crate version
    needs: [test, conformance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: ""

      # Publishing is automated: the publish job below runs on GitHub
      # release creation. This tag/version consistency gate remains the
      # cheap check that the tag matches the published crate versions.
      - name: Verify tag equals the crate versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for crate in guard-core-rs guard-core-engine; do
            version=$(cargo metadata --no-deps --format-version 1 | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')
            if [ "$tag" != "$version" ]; then
              echo "tag v$tag does not match $crate version $version"
              exit 1
            fi
            echo "ok: tag v$tag matches $crate version $version"
          done

  publish:
    name: Publish to crates.io
    needs: tag-consistency
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: ""

      # guard-core-rs depends on guard-core-engine, so the engine must go
      # first. Each publish is retried up to 3 times (crates.io transient
      # 5xx). NOTE on reruns: crates.io rejects re-uploading an identical
      # version, so if guard-core-engine already landed and only the
      # facade failed, re-run only the "Publish guard-core-rs" step.
      - name: Publish guard-core-engine
        run: |
          for attempt in 1 2 3; do
            if cargo publish -p guard-core-engine; then
              exit 0
            fi
            echo "attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          echo "guard-core-engine publish failed after 3 attempts"
          exit 1

      - name: Publish guard-core-rs
        run: |
          for attempt in 1 2 3; do
            if cargo publish -p guard-core-rs; then
              exit 0
            fi
            echo "attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          echo "guard-core-rs publish failed after 3 attempts"
          exit 1
