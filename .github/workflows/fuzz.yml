name: fuzz

on:
  push:
    branches: [master]
    paths:
      - "fuzz/**"
      - "crates/guard-core-engine/**"
      - ".github/workflows/fuzz.yml"
  pull_request:
    paths:
      - "fuzz/**"
      - "crates/guard-core-engine/**"
      - ".github/workflows/fuzz.yml"

permissions: {}

jobs:
  build:
    name: Build fuzz targets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install nightly toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: nightly
          components: rustfmt

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Build fuzz targets
        run: cargo +nightly fuzz build

  smoke:
    name: Short fuzz run (60s per target)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install nightly toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Fuzz preprocessor (60s)
        run: cargo +nightly fuzz run fuzz_preprocess -- -max_total_time=60

      - name: Fuzz semantic (60s)
        run: cargo +nightly fuzz run fuzz_semantic -- -max_total_time=60

      - name: Fuzz compiler (60s)
        run: cargo +nightly fuzz run fuzz_compiler -- -max_total_time=60
