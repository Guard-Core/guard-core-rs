# Expected-fail baseline for the guard-core-rs conformance runner against spec 4.1.0.
# The engine runs the full 4.x detect pipeline (pattern table across the four
# scan views, semantic analysis, scoring) and passes the corpus. The corpus is
# the reference spec 4.1.0 detect set (detect expectations unchanged since 4.0.3): it deliberately excludes full-entropy
# random-noise binary cases, whose decode-stage parity gaps are covered by the
# guard-core-engine binary_noise_gate honesty tests instead.
#
# Pipeline-kind suites (spec 4.1.0): entries here name architecture gaps of the
# rust family's stage composition. The security-headers manager, CORS, the
# response-side process_response pass (behavior rules included), the
# suspicious-activity 400 stage, the route detection exclusions, and the route
# ip_whitelist/ip_blacklist surface have all been ported; the only documented
# comparison skip is the reference-vocabulary event-bus capture (the
# `events` key, see the pipeline runner's module docs).
# Each reason is the honest gap, per specs/fixtures/README.md. The rules are
# fail-closed:
#   - failing case NOT listed here -> gate fails (unbaselined failure)
#   - listed case that now PASSES  -> gate fails (stale baseline; remove the entry)
#   - failing case listed here     -> xfail (tolerated, reported four-way)
spec_version = '4.1.0'
cases = []
