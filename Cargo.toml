[workspace]
members  = ["crates/*", "examples/*"]
exclude  = ["fuzz"]
resolver = "3"

[workspace.package]
authors = [
  "Renzo Franceschini <rennf93@users.noreply.github.com>",
  "MihaiStreames <72852703+MihaiStreames@users.noreply.github.com>",
]
categories = ["web-programming"]
documentation = "https://docs.rs/guard-core-rs"
edition = "2024"
homepage = "https://github.com/rennf93/guard-core-rs"
keywords = ["security", "middleware", "api", "detection-engine", "waf"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rennf93/guard-core-rs"
rust-version = "1.92"

[workspace.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[workspace.dependencies]
guard-core-rs = { path = "crates/guard-core-rs", version = "4.2.0" }
guard-core-engine = { path = "crates/guard-core-engine", version = "4.2.0" }

criterion             = { version = "0.8.2", default-features = false }
html-escape           = "0.2.13"
lru                   = "0.18.0"
percent-encoding      = "2.3.2"
pyo3                  = { version = "0.29.0", features = ["extension-module", "abi3-py310"] }
regex                 = "1.12.4"
serde                 = { version = "1.0.228", features = ["derive"] }
serde_json            = { version = "1.0.145", features = ["preserve_order"] }
toml                  = "0.9.11"
unicode-normalization = "0.1.25"

# The binary-noise honesty tests scan 256 KiB payloads; unoptimized
# dependencies make the regex engine ~20x slower and violate the reference
# performance contract (< 5 s per scan) under plain `cargo test`. Optimize
# dependencies in the test profile while keeping workspace crates cheap to
# compile.
[profile.test.package."*"]
opt-level = 2
