[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # h2 0.3.27 (RUSTSEC-2026-0258, unbounded empty DATA frames): the rocket
  # example (examples/rocket_app) pulls rocket 0.5.1, whose rocket_http hard
  # pins hyper 0.14, and the h2 0.3 line has no fix (the patched h2 0.4.16
  # can never be used by hyper 0.14). The vulnerable path is hyper's own
  # HTTP/2 protocol handling, not any guard-core code; the example crate is
  # publish = false. Revisit when rocket ships a hyper 0.14-free release.
  "RUSTSEC-2026-0258",
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
