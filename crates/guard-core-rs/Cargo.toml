[package]
name          = "guard-core-rs"
version       = "4.2.0"
authors       = { workspace = true }
categories    = { workspace = true }
description   = "Framework-agnostic security engine for the Guard ecosystem."
documentation = { workspace = true }
edition       = { workspace = true }
homepage      = { workspace = true }
keywords      = { workspace = true }
license       = { workspace = true }
repository    = { workspace = true }
rust-version  = { workspace = true }

[dependencies]
chrono            = { version = "0.4", default-features = false, features = ["clock"] }
guard-core-engine = { workspace = true }
html-escape       = { workspace = true }
http              = "1.3"
serde_json        = { workspace = true }
tower             = { version = "0.5", default-features = false }
ureq              = { version = "2.10", default-features = false, features = ["tls", "gzip"] }
redis             = { version = "0.27", optional = true, default-features = false, features = ["acl"] }

[features]
# The Redis-backed distributed store (the reference `enable_redis`
# mode). The engine seam is feature-free; only the backend lives here.
redis = ["dep:redis"]

[lints.rust]
unsafe_code = "forbid"
# cargo-llvm-cov sets cfg(coverage) during coverage builds; declare it so the
# cfg(not(coverage)) pairs in the sources stay lint-clean.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lints.clippy]
all                      = { level = "deny", priority = -1 }
cast_possible_truncation = "allow"
missing_errors_doc       = "allow"
missing_panics_doc       = "allow"
module_name_repetitions  = "allow"
nursery                  = { level = "warn", priority = -1 }
pedantic                 = { level = "warn", priority = -1 }
