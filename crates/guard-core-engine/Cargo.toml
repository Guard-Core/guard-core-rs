[package]
name         = "guard-core-engine"
version      = "4.2.0"
description  = "Detection engine for the Guard ecosystem: pattern compilation, input preprocessing, and semantic analysis."
edition      = { workspace = true }
license      = { workspace = true }
rust-version = { workspace = true }

[dependencies]
chrono                = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz             = { version = "0.10", default-features = false, features = ["case-insensitive"] }
fancy-regex           = { version = "0.19", default-features = false, features = ["unicode"] }
html-escape           = { workspace = true }
sha2                  = "0.11"
lru                   = { workspace = true }
percent-encoding      = { workspace = true }
rand                  = { version = "0.10", default-features = false, features = ["std", "thread_rng"] }
regex                 = { workspace = true }
serde_json            = { workspace = true }
unicode-normalization = { workspace = true }

# The killable probe child: the pattern-safety chain self-execs this
# binary (hidden subcommand) so a runaway backtracking loop can be killed
# on deadline.
[[bin]]
name = "guard-pattern-probe"
path = "src/bin/guard_pattern_probe.rs"

[lints.rust]
unsafe_code = "forbid"
# cargo-llvm-cov sets cfg(coverage) during coverage builds; declare it so the
# cfg(not(coverage)) pairs in the sources stay lint-clean.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lints.clippy]
all                      = { level = "deny", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss      = "allow"
missing_errors_doc       = "allow"
missing_panics_doc       = "allow"
module_name_repetitions  = "allow"
nursery                  = { level = "warn", priority = -1 }
pedantic                 = { level = "warn", priority = -1 }
