[package]
name         = "guard-core-engine"
version      = "4.2.0"
description  = "Detection engine for the Guard ecosystem: pattern compilation, input preprocessing, and semantic analysis."
edition      = { workspace = true }
license      = { workspace = true }
rust-version = { workspace = true }

[dependencies]
chrono                = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz             = { version = "0.10", default-features = false, features = ["case-insensitive"] }
html-escape           = { workspace = true }
sha2                  = "0.10"
lru                   = { workspace = true }
percent-encoding      = { workspace = true }
rand                  = { version = "0.9", default-features = false, features = ["std", "thread_rng"] }
regex                 = { workspace = true }
serde_json            = { workspace = true }
unicode-normalization = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all                      = { level = "deny", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss      = "allow"
missing_errors_doc       = "allow"
missing_panics_doc       = "allow"
module_name_repetitions  = "allow"
nursery                  = { level = "warn", priority = -1 }
pedantic                 = { level = "warn", priority = -1 }
