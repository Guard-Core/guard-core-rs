[package]
name         = "guard-core-conformance"
version      = "4.3.2"
publish      = false
edition      = { workspace = true }
license      = { workspace = true }
rust-version = { workspace = true }

[lib]
bench = false

[dependencies]
guard-core-engine = { workspace = true }
guard-core-rs = { workspace = true }
regex             = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
toml              = { workspace = true }

[dev-dependencies]
fancy-regex       = { version = "0.19", default-features = false }

[lints.rust]
unsafe_code = "forbid"
# cargo-llvm-cov sets cfg(coverage) during coverage builds; declare it so the
# cfg(not(coverage)) pairs in the sources stay lint-clean.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lints.clippy]
all                      = { level = "deny", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss      = "allow"
missing_errors_doc       = "allow"
missing_panics_doc       = "allow"
module_name_repetitions  = "allow"
nursery                  = { level = "warn", priority = -1 }
pedantic                 = { level = "warn", priority = -1 }
