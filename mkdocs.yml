site_name: guard-core-rs
site_description: Rust application-layer API security engine - content preprocessing, semantic analysis, and pattern detection
site_author: Renn F
repo_url: https://github.com/Guard-Core/guard-core-rs
repo_name: Guard-Core/guard-core-rs

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
  features:
    - content.code.copy
    - navigation.sections

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - tables

nav:
  - Home: index.md
  - Usage: usage.md
  - Configuration: configuration.md
